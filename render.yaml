services:
  - type: web
    name: whatsapp-fastapi-test-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v23.0
